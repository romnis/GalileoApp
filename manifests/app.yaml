apiVersion: apps/v1
kind: Deployment
metadata:
  name: romnis-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: romnis
  template:
    metadata:
      labels:
        app: romnis
    spec:
      containers:
      - name: romnis
        image: romnis-app:latest
        imagePullPolicy: Never  # Tells Kubernetes to use the local Minikube image
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: romnis-service
  namespace: default
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30080
  selector:
    app: romnis