apiVersion: apps/v1
kind: Deployment
metadata:
  name: romnis-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: romnis
  template:
    metadata:
      labels:
        app: romnis
    spec:
      containers:
      - name: romnis
        image: romnis-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: romnis-service
  namespace: default
spec:
  type: ClusterIP  # Keeps it internally routable via the NGINX Ingress controller
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: romnis
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: romnis-ingress
  namespace: default
  annotations:
    link.argocd.argoproj.io/external-url: "http://romnis.local/romnis"
spec:
  rules:
  - host: romnis.local
    http:
      paths:
      - path: /romnis
        pathType: Prefix
        backend:
          service:
            name: romnis-service
            port:
              number: 80