apiVersion: apps/v1
kind: Deployment
metadata:
  name: romnis-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: romnis
  template:
    metadata:
      labels:
        app: romnis
    spec:
      containers:
      - name: romnis
        image: romnis-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: romnis-service
  namespace: default
  labels:
    hi: rom
spec:
  type: LoadBalancer  # Keeps it internally routable via the NGINX Ingress controller
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: romnis